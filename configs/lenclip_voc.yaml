# LenCLIP: VOC 2012, image-level supervision only.
dataset:
  name: voc
  root_dir: data/VOCdevkit/VOC2012
  name_list_dir: datasets/voc
  num_classes: 21
  crop_size: 320
  rescale_range: [0.5, 2.0]
  ignore_index: 255
model:
  clip_pretrain_path: pretrained/ViT-B-16.pt
  embedding_dim: 256
  fusion_layers: 11
  decoder_layers: 3
  region_size: 224
  region_batch_size: 2
  gradient_checkpointing: true
prompt:
  n_ctx: 30
  class_specific: false
va:
  enabled: true
  radius: 1
  iterations: 1
  visual_temperature: 0.1
  semantic_temperature: 0.1
  background_scale: 0.2
loss:
  lambda_a: 0.6
  lambda_b: 0.2
  lambda_lp: 0.7
  # Explicit completions of manuscript ambiguities; see docs/IMPLEMENTATION.md.
  cosine_mode: shifted
  background_prompt_weight: 1.0
  eps: 0.000001
  seg_weight: 1.0
  affinity_weight: 0.1
  affinity_radius: 8
  lpg_weight: 1.0
pseudo:
  use_clip_attention: true
  attention_layers: 8
  affinity_start: 15000
  background_power: 1.0
  par_iterations: 20
  par_dilations: [1, 2, 4, 8, 12, 24]
  par_scale: 1.0
optimizer:
  learning_rate: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
scheduler:
  warmup_iters: 50
  warmup_ratio: 0.000001
  power: 1.0
train:
  split: train_aug
  work_dir: LenCLIP_runs/voc
  batch_size: 4
  max_iters: 30000
  num_workers: 4
  seed: 1
  log_iters: 200
  save_iters: 2000
  eval_iters: 2000
  grad_clip: 0.0
val:
  split: val
inference:
  scales: [0.75, 1.0]
  flip: false
  num_workers: 4
